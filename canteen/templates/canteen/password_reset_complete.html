{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete</title>
    <link rel="stylesheet" href="{% static 'canteen/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'canteen/css/dashboard.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">🍽️</span>
                Food<span class="logo-highlight">Hub</span>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/register" class="nav-link">Register</a></li>
                <li><a href="/login" class="nav-link active">Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="dashboard-section menu-management-section">
        <div class="dashboard-container menu-management-container">
            <main class="dashboard-content menu-management-content">
                <div class="welcome-card menu-management-welcome">
                    <div>
                        <p class="welcome-kicker">SUCCESS</p>
                        <h1>Password Reset Complete</h1>
                        <p>Your password has been updated successfully.</p>
                    </div>
                    <div class="welcome-badge">Done</div>
                </div>

                <div class="menu-management-panels" style="grid-template-columns: 1fr; max-width: 760px; margin: 0 auto;">
                    <div class="dashboard-section-card menu-item-form-card">
                        <h2>✅ Password Updated</h2>
                        <div class="messages">
                            <div class="alert alert-success">
                                You can now log in with your new password.
                            </div>
                        </div>
                        <div class="menu-form-actions">
                            <a href="/login" class="btn btn-primary">Go to login</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </section>
</body>
</html>
